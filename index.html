<script>
  let currentFilter = 'all';
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
  // Ajouter avec les autres variables
let currentCategory = 'all';
let categories = JSON.parse(localStorage.getItem("categories") || "[]");

  // === SAUVEGARDE AUTOMATIQUE TOUTES LES 5 HEURES ===
  const BACKUP_INTERVAL_MS = 6 * 60 * 60 * 1000;
  const BACKUP_FILENAME = "taches_backup.json";

  // Remplacer la fonction saveTasks existante par celle-ci
function saveTasks() {
    // Ajouter la date de modification
    tasks.forEach(task => {
        if (!task.lastModified) {
            task.lastModified = new Date().toISOString();
        }
    });
    
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("categories", JSON.stringify(categories));
    
    // Si en ligne et pas déjà en train de synchroniser
    if (isOnline && !window.isSyncing) {
        clearTimeout(window.syncTimeout);
        window.syncTimeout = setTimeout(() => {
            saveToGoogleDrive();
        }, 3000);
    } else if (!isOnline) {
        pendingSync = true;
    }
}

function autoBackupTasks() {
    const data = JSON.stringify(tasks, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = BACKUP_FILENAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

    console.log("✅ Sauvegarde auto à", new Date().toLocaleString());
}

// Évite plusieurs sauvegardes durant la même minute
let lastBackupKey = "";

// Vérifie l'heure chaque minute
setInterval(() => {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();

    // 11:00 ou 17:00
    if ((hours === 11 || hours === 17) && minutes === 0) {
        const backupKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${hours}`;

        if (backupKey !== lastBackupKey) {
            lastBackupKey = backupKey;
            autoBackupTasks();
        }
    }
}, 60000);

  // === GESTION UNIVERSELLE DES NOTIFICATIONS ===
  
  // Version compatible avec TOUS les navigateurs Chrome
  function sendNotification(title, message) {
    // 1️⃣ Méthode 1: Service Worker (la meilleure, fonctionne même en arrière-plan)
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(function(registration) {
        try {
          registration.showNotification(title || '🔔', {
            body: message || 'Tâche en attente',
            icon: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/img/bootstrap-logo.svg',
            badge: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/img/bootstrap-logo.svg',
            vibrate: [200, 100, 200],
            requireInteraction: true,
            tag: 'reminder-' + Date.now(),
            data: {
              url: window.location.href,
              time: new Date().toISOString()
            }
          });
          return true;
        } catch(e) {
          console.warn('SW notification error:', e);
        }
      });
    }

    // 2️⃣ Méthode 2: Notification API (fallback pour Chrome sans SW)
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        const notification = new Notification(title || '🔔 Rappel', {
          body: message || 'Tâche en attente',
          icon: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/img/bootstrap-logo.svg',
          requireInteraction: true,
          tag: 'reminder-' + Date.now()
        });
        
        notification.onclick = function() {
          window.focus();
          this.close();
        };
        
        return true;
      } catch(e) {
        console.warn('Notification API error:', e);
      }
    }

    // 3️⃣ Méthode 3: Affichage dans la page (fallback ultime)
    showInPageNotification(title, message);
    return false;
  }

  // Affichage dans la page (fonctionne toujours)
  function showInPageNotification(title, message) {
    const container = document.getElementById('notificationContainer');
    if (!container) return;

    const notif = document.createElement('div');
    notif.className = 'alert alert-warning alert-dismissible fade show';
    notif.style.backgroundColor = '#fff3cd';
    notif.style.borderLeft = '4px solid #ffc107';
    notif.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
    notif.innerHTML = `
      <strong>${title || '🔔 Rappel'}</strong><br>
      ${message || 'Tâche en attente'}
      <button type="button" class="btn-close" data-bs-dismiss="alert" onclick="this.parentElement.remove()"></button>
    `;
    
    container.appendChild(notif);
    
    // Auto-supprimer après 30 secondes
    setTimeout(() => {
      if (notif.parentElement) notif.remove();
    }, 30000);
  }

  // Fonction pour ajouter une notification persistante
  // Fonction pour ajouter une notification persistante
function addPersistentNotification(taskIndex, taskText, dueDate, reminderTime) {
  let notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
  
  // IMPORTANT: Utiliser la dueDate passée en paramètre, PAS la date du jour
  const notification = {
    id: Date.now() + Math.random() * 1000,
    taskIndex: taskIndex,
    text: taskText,
    dueDate: dueDate || new Date().toISOString().split('T')[0], // Utiliser dueDate reçue
    reminderTime: reminderTime || '12:00',
    createdAt: new Date().toISOString(),
    completed: false,
    postponed: false,
    hourAdded: 0
  };
  
  notifications.push(notification);
  localStorage.setItem("persistentNotifications", JSON.stringify(notifications));
  displayPersistentNotifications();
  console.log("✅ Notification persistante ajoutée:", notification);
}

  // Fonction pour afficher les notifications persistantes
  function displayPersistentNotifications() {
  const container = document.getElementById('persistentNotificationsContainer');
  if (!container) {
    console.error("❌ Container des notifications introuvable");
    return;
  }
  
  const notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
  container.innerHTML = '';
  
  // Filtrer les notifications non complétées et non reportées
  const activeNotifications = notifications.filter(n => !n.completed && !n.postponed);
  
  if (activeNotifications.length === 0) {
    const emptyMsg = document.createElement('div');
    emptyMsg.className = 'notification-empty';
    emptyMsg.textContent = '';
    container.appendChild(emptyMsg);
    return;
  }
  
  // Afficher chaque notification persistante
  activeNotifications.forEach(notification => {
    const notifDiv = document.createElement('div');
    notifDiv.className = 'notification-persistent';
    
    // Déterminer si la notification est expirée
    const dueDate = new Date(notification.dueDate);
    const isExpired = dueDate < new Date();
    
    if (isExpired) {
      notifDiv.classList.add('expired');
    }
    
    // Formater la date d'échéance
    const formattedDate = notification.dueDate ? new Date(notification.dueDate).toLocaleDateString('fr-FR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    }) : 'Date inconnue';
    
    notifDiv.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: start; gap: 10px;">
        <div style="flex: 1;">
          <strong style="color: ${isExpired ? '#d32f2f' : '#856404'}; font-size: 14px;">
            ⏰ RAPPEL
          </strong>
          <div style="font-size: 15px; margin: 8px 0; font-weight: 500;">
            ${notification.text}
          </div>
          <div style="font-size: 12px; color: #666;">
            📅 ${formattedDate}
            ⏰ ${notification.reminderTime || '12:00'}
            ${isExpired ? ' ⚠️ En retard' : ''}
            ${notification.hourAdded > 0 ? ` (⏱️ +${notification.hourAdded}h)` : ''}
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
        <button class="btn-accomplish" onclick="accomplishNotification(${notification.id})">
          ✅ Accomplir
        </button>
        <button class="btn-add-hour" onclick="addHourNotification(${notification.id})">
          🕐 +1h
        </button>
        <button class="btn-postpone" onclick="postponeNotification(${notification.id})">
          📅 Pour demain
        </button>
        <button class="btn-dismiss" onclick="dismissNotification(${notification.id})">
          ✕
        </button>
      </div>
    `;
    
    container.appendChild(notifDiv);
  });
  
  console.log(`📋 ${activeNotifications.length} notifications persistantes affichées`);
}

  // Fonction pour accomplir une notification
  function accomplishNotification(notificationId) {
    let notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
    const notification = notifications.find(n => n.id === notificationId);
    
    if (notification) {
      notification.completed = true;
      localStorage.setItem("persistentNotifications", JSON.stringify(notifications));
      
      // Marquer la tâche correspondante comme accomplie
      if (tasks[notification.taskIndex]) {
        tasks[notification.taskIndex].completed = true;
        saveTasks();
        loadTasks();
        saveToGoogleDrive();
      }
      
      displayPersistentNotifications();
      showInPageNotification('✅ Tâche accomplie', `"${notification.text}" a été marquée comme accomplie`);
    }
  }

  // NOUVELLE FONCTION : Ajouter 1 heure à la notification
  function addHourNotification(notificationId) {
    let notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
    const notification = notifications.find(n => n.id === notificationId);
    
    if (notification) {
      // Ajouter 1 heure
      const [hours, minutes] = notification.reminderTime.split(":").map(Number);
      let newHours = hours + 1;
      
      // Si on dépasse 23h, on passe à minuit le lendemain
      if (newHours >= 24) {
        newHours = newHours - 24;
        // Ajouter un jour
        const tomorrow = new Date(notification.dueDate);
        tomorrow.setDate(tomorrow.getDate() + 1);
        notification.dueDate = tomorrow.toISOString().split('T')[0];
      }
      
      notification.reminderTime = String(newHours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
      notification.hourAdded = (notification.hourAdded || 0) + 1;
      
      // Mettre à jour la tâche correspondante
      if (tasks[notification.taskIndex]) {
        tasks[notification.taskIndex].reminderTime = notification.reminderTime;
        tasks[notification.taskIndex].dueDate = notification.dueDate;
        saveTasks();
        loadTasks();
        saveToGoogleDrive();
      }
      
      localStorage.setItem("persistentNotifications", JSON.stringify(notifications));
      displayPersistentNotifications();
      showInPageNotification('🕐 +1 heure', `"${notification.text}" reporté à ${notification.reminderTime}`);
    }
  }

  // Fonction pour reporter une notification à demain
  function postponeNotification(notificationId) {
    let notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
    const notification = notifications.find(n => n.id === notificationId);
    
    if (notification) {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = tomorrow.toISOString().split('T')[0];
      
      notification.dueDate = tomorrowStr;
      notification.postponed = true;
      
      if (tasks[notification.taskIndex]) {
        tasks[notification.taskIndex].dueDate = tomorrowStr;
        saveTasks();
        loadTasks();
        saveToGoogleDrive();
      }
      
      localStorage.setItem("persistentNotifications", JSON.stringify(notifications));
      displayPersistentNotifications();
      showInPageNotification('📅 Reporté à demain', `"${notification.text}" a été reporté au ${formatDate(tomorrowStr)}`);
    }
  }

  // Fonction pour ignorer une notification
  function dismissNotification(notificationId) {
    let notifications = JSON.parse(localStorage.getItem("persistentNotifications") || "[]");
    notifications = notifications.filter(n => n.id !== notificationId);
    localStorage.setItem("persistentNotifications", JSON.stringify(notifications));
    displayPersistentNotifications();
  }

  // Fonction pour envoyer une notification persistante
 // Fonction pour envoyer une notification persistante
function sendPersistentNotification(taskIndex, taskText, dueDate, reminderTime) {
  playNotificationSound();
  sendNotification('🔔 Rappel', taskText);

}

  // === VÉRIFICATION DES RAPPELS AMÉLIORÉE AVEC PERSISTANCE ===
  // === VÉRIFICATION DES RAPPELS AVEC PERSISTANCE ===
function checkRemindersWithPersistence() {
  const now = new Date();
  const today = now.toISOString().split("T")[0];
  const currentHour = now.getHours();
  const currentMinute = now.getMinutes();

  tasks.forEach((task, index) => {
    // 1. Vérifier si la tâche est déjà accomplie
    if (task.completed) return;
    
    // 2. Vérifier si la tâche a une heure de rappel
    if (!task.reminderTime) return;
    
    // 3. Vérifier si la tâche a une date d'échéance
    if (!task.dueDate) return;

    // 4. Extraire l'heure et les minutes du rappel
    const [hour, minute] = task.reminderTime.split(":").map(Number);
    
    // 5. Vérifier si l'heure correspond (avec une marge de 1 minute)
    const hourMatch = hour === currentHour;
    const minuteMatch = minute === currentMinute || 
                        minute === currentMinute - 1 || 
                        minute === currentMinute + 1;
    
    if (!hourMatch || !minuteMatch) return;

    // 6. Vérifier si la tâche doit être affichée selon son type de répétition
    const due = new Date(task.dueDate);
    let show = false;

    switch(task.repeat){
      case "day":
        show = (task.dueDate === today);
        break;
      case "daily":
        show = true;
        break;
      case "monthly":
        show = due.getDate() === now.getDate();
        break;
      case "yearly":
        show = due.getDate() === now.getDate() && 
               due.getMonth() === now.getMonth();
        break;
    }

    if(!show) return;

    // 7. Éviter les doublons de rappel
    const key = today + "_" + currentHour + "_" + currentMinute;
    if(task.lastReminder === key) return;

    // 8. Envoyer la notification AVEC la date et l'heure de la tâche
    console.log(`📨 Envoi notification pour: "${task.text}" à ${task.reminderTime} le ${task.dueDate}`);
    sendPersistentNotification(index, task.text, task.dueDate, task.reminderTime);
    
    // 9. Marquer le rappel comme envoyé
    task.lastReminder = key;
    saveTasks();
    saveToGoogleDrive();
  });
}

  // === VÉRIFICATION DES RAPPELS ORIGINALE (conservée) ===
  function checkReminders() {
    const now = new Date();
    const today = now.toISOString().split("T")[0];
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();

    tasks.forEach(task => {
        if (task.completed) return;
        if (!task.reminderTime) return;

        const [hour, minute] = task.reminderTime.split(":").map(Number);
        if (hour !== currentHour || minute !== currentMinute) return;

        const [y, m, d] = task.dueDate.split("-").map(Number);
const due = new Date(y, m - 1, d);
        let show = false;

        switch(task.repeat){
            case "day":
                show = (task.dueDate === today);
                break;
            case "daily":
                show = true;
                break;
            case "monthly":
                show = due.getDate() === now.getDate();
                break;
            case "yearly":
                show = due.getDate() === now.getDate() && due.getMonth() === now.getMonth();
                break;
        }

        if(!show) return;

        const key = today + "_" + currentHour + "_" + currentMinute;
        if(task.lastReminder === key) return;

        sendNotification("🔔 Rappel", task.text);
        task.lastReminder = key;
        saveTasks();
        saveToGoogleDrive();
    });
  }

  // === SERVICE WORKER - ENREGISTREMENT AMÉLIORÉ ===
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) {
      console.warn('⚠️ Service Worker non supporté par ce navigateur');
      requestNotificationPermission();
      return;
    }

    navigator.serviceWorker.register('service-worker.js')
      .then(function(registration) {
        console.log('✅ Service Worker enregistré avec succès');
        requestNotificationPermission();
        registration.update();
      })
      .catch(function(error) {
        console.warn('⚠️ Échec de l\'enregistrement SW, utilisation du fallback:', error);
        registerInlineServiceWorker();
      });
  }

  // Service Worker inline (fallback)
  function registerInlineServiceWorker() {
    const swCode = `
      self.addEventListener('install', function(e) {
        self.skipWaiting();
      });

      self.addEventListener('activate', function(e) {
        e.waitUntil(clients.claim());
      });

      self.addEventListener('notificationclick', function(e) {
        e.notification.close();
        e.waitUntil(
          clients.matchAll({ type: 'window' }).then(function(clientList) {
            for (var i = 0; i < clientList.length; i++) {
              var client = clientList[i];
              if (client.url && 'focus' in client) {
                return client.focus();
              }
            }
            if (clients.openWindow) {
              return clients.openWindow(e.notification.data?.url || '/');
            }
          })
        );
      });
    `;

    try {
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      
      navigator.serviceWorker.register(swUrl)
        .then(function(registration) {
          console.log('✅ Service Worker inline enregistré');
          requestNotificationPermission();
          setTimeout(() => URL.revokeObjectURL(swUrl), 1000);
        })
        .catch(function(err) {
          console.warn('⚠️ Échec du SW inline, utilisation des notifications classiques');
          requestNotificationPermission();
        });
    } catch(e) {
      console.warn('⚠️ Erreur SW inline:', e);
      requestNotificationPermission();
    }
  }

  // Demander la permission pour les notifications
  // === DEMANDER LA PERMISSION POUR LES NOTIFICATIONS (AMÉLIORÉ) ===
function requestNotificationPermission() {
    if (!('Notification' in window)) {
        showInPageNotification('⚠️', 'Les notifications ne sont pas supportées par ce navigateur');
        updateNotificationStatus('not-supported');
        return;
    }

    // Si déjà accordée
    if (Notification.permission === 'granted') {
        updateNotificationStatus('granted');
        return;
    }

    // Si déjà refusée
    if (Notification.permission === 'denied') {
        showInPageNotification('⚠️', 'Notifications refusées. Veuillez les autoriser dans les paramètres de votre navigateur.');
        updateNotificationStatus('denied');
        // Ouvrir les paramètres du navigateur
        if (navigator.userAgent.includes('Chrome')) {
            showInPageNotification('💡', 'Allez dans Paramètres > Confidentialité > Notifications');
        }
        return;
    }

    // Demander la permission (cela déclenche la popup uniquement sur clic)
    Notification.requestPermission()
        .then(function(permission) {
            if (permission === 'granted') {
                console.log('✅ Permission notifications accordée');
                updateNotificationStatus('granted');
                
                // Envoyer une notification de test
                showInPageNotification('✅', 'Notifications activées avec succès !');
                
                // Sauvegarder la permission
                localStorage.setItem('notificationsGranted', 'true');
            } else {
                console.warn('⚠️ Permission notifications refusée');
                updateNotificationStatus('denied');
                showInPageNotification('⚠️', 'Notifications refusées. Vous pouvez les activer plus tard.');
            }
        })
        .catch(function(err) {
            console.warn('⚠️ Erreur demande permission:', err);
            updateNotificationStatus('error');
        });
}

// === METTRE À JOUR LE STATUT D'AFFICHAGE ===
function updateNotificationStatus(status) {
    const statusEl = document.getElementById('notifStatus');
    const btn = document.getElementById('notifPermissionBtn');
    if (!statusEl) return;
    
    switch(status) {
        case 'granted':
            statusEl.innerHTML = '✅ Notifications activées';
            statusEl.style.color = '#2e7d32';
            if (btn) {
                btn.textContent = '✅ Notifications activées';
                btn.style.background = '#4caf50';
            }
            break;
        case 'denied':
            statusEl.innerHTML = '❌ Notifications refusées - <a href="#" onclick="openNotificationSettings()" style="color:#d32f2f;">Ouvrir paramètres</a>';
            statusEl.style.color = '#c62828';
            if (btn) {
                btn.textContent = '🔔 Réactiver';
                btn.style.background = '#dc3545';
            }
            break;
        case 'not-supported':
            statusEl.innerHTML = '⚠️ Non supporté par ce navigateur';
            statusEl.style.color = '#ff6f00';
            if (btn) {
                btn.textContent = '⚠️ Non supporté';
                btn.style.background = '#6c757d';
                btn.disabled = true;
            }
            break;
        case 'pending':
            statusEl.innerHTML = '⏳ Demande en cours...';
            statusEl.style.color = '#ff6f00';
            break;
        default:
            statusEl.innerHTML = '🔔 Cliquez pour activer les notifications';
            statusEl.style.color = '#666';
            if (btn) {
                btn.textContent = '🔔 Activer notifications';
                btn.style.background = '#007bff';
            }
    }
}

// === OUVRIR LES PARAMÈTRES DE NOTIFICATIONS DU NAVIGATEUR ===
function openNotificationSettings() {
    // Pour Chrome
    if (navigator.userAgent.includes('Chrome')) {
        window.open('chrome://settings/content/notifications', '_blank');
    } 
    // Pour Firefox
    else if (navigator.userAgent.includes('Firefox')) {
        window.open('about:preferences#privacy', '_blank');
    }
    // Pour Edge
    else if (navigator.userAgent.includes('Edg')) {
        window.open('edge://settings/content/notifications', '_blank');
    }
    // Autres navigateurs
    else {
        showInPageNotification('💡', 'Veuillez activer les notifications dans les paramètres de votre navigateur');
    }
}

  // Dans addTask(), ajouter la catégorie
function addTask() {
  let text = document.getElementById("taskInput").value.trim();
  if (!text) return;
  text = text.charAt(0).toUpperCase() + text.slice(1);

  const repeat = document.getElementById("repeatSelect").value;
  const dueDate = document.getElementById("dateInput").value;
  const reminderTime = document.getElementById("reminderTimeInput").value;
  const category = document.getElementById("categoryInput").value.trim();

  // Sauvegarder l'état pour undo
  saveState();

  const task = {
    text,
    repeat,
    dueDate: dueDate || "",
    reminderTime: reminderTime || "",
    completed: false,
    lastReminder: null,
    category: category ? category.charAt(0).toUpperCase() + category.slice(1).toLowerCase() : "",
    categories: category ? [category.charAt(0).toUpperCase() + category.slice(1).toLowerCase()] : [],
    createdAt: new Date().toISOString()
  };
  
  tasks.push(task);
  
  // Ajouter la catégorie à la liste globale
  if (category) {
    const cat = category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();
    if (!categories.includes(cat)) {
      categories.push(cat);
    }
  }
  
  saveTasks();
  saveToGoogleDrive();

  document.getElementById("taskInput").value = "";
  document.getElementById("dateInput").value = "";
  document.getElementById("reminderTimeInput").value = "";
  document.getElementById("categoryInput").value = "";
  loadTasks();
}

// Filtrer par catégorie
function matchesCategory(task) {
  if (currentCategory === 'all') return true;
  if (task.category === currentCategory) return true;
  if (task.categories && task.categories.includes(currentCategory)) return true;
  return false;
}

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveTasks();
    loadTasks();
    saveToGoogleDrive();
  }

  function deleteTask(index) {
    if (!confirm(`Supprimer la tâche "${tasks[index].text}" ?`)) return;
    tasks.splice(index, 1);
    saveTasks();
    loadTasks();
    saveToGoogleDrive();
  }

  // Dans editTask(), ajouter la gestion des catégories
function editTask(index) {
  const task = tasks[index];
  const newText = prompt("Modifier la tâche :", task.text);
  if (newText === null || newText.trim() === "") return;

  // Sauvegarder l'état pour undo
  saveState();

  task.text = newText.trim();
  task.repeat = prompt("Rappel (day, daily, monthly, yearly) :", task.repeat) || task.repeat;
  task.dueDate = prompt("Date (YYYY-MM-DD) :", task.dueDate) || task.dueDate;
  task.reminderTime = prompt("Heure de rappel (HH:MM) :", task.reminderTime) || task.reminderTime;
  
  // Gestion des catégories
  const currentCat = task.categories ? task.categories.join(', ') : '';
  const newCat = prompt("Catégories (séparées par des virgules) :", currentCat);
  if (newCat !== null && newCat.trim() !== "") {
    const catList = newCat.split(',').map(c => c.trim().charAt(0).toUpperCase() + c.trim().slice(1).toLowerCase());
    task.categories = catList.filter(c => c !== '');
    task.category = task.categories.length > 0 ? task.categories[0] : '';
    
    // Ajouter les nouvelles catégories à la liste globale
    task.categories.forEach(c => {
      if (!categories.includes(c)) categories.push(c);
    });
  }

  saveTasks();
  loadTasks();
  saveToGoogleDrive();
}

  function matchesFilter(task) {
    const today = new Date().toISOString().split("T")[0];
    if (currentFilter === "done") return task.completed;
    if (currentFilter === "notDone") return !task.completed;
    if (currentFilter === "today") return task.dueDate === today;
    if (["day", "daily", "monthly", "yearly"].includes(currentFilter)) return task.repeat === currentFilter;
    return true;
  }

  function matchesSearch(task) {
    const search = document.getElementById("searchInput").value.toLowerCase();
    return task.text.toLowerCase().includes(search);
  }

function formatDate(dateString) {
    if (!dateString) return "Date inconnue";

    const [year, month, day] = dateString.split("-");

    return `${day}/${month}/${year}`;
}

  function getRepeatLabel(repeat) {
    if (repeat === "day") return "Jour";
    if (repeat === "daily") return "Journalier";
    if (repeat === "monthly") return "Mensuel";
    if (repeat === "yearly") return "Annuel";
    return "Aucun";
  }

  function shouldDisplayTask(task) {
    return !task.completed || currentFilter === "done";

  // ============================================================
  // HISTORIQUE UNDO / REDO
  // ============================================================
  let history = [];
  let historyIndex = -1;
  const MAX_HISTORY = 50;

  function saveState() {
    if (historyIndex < history.length - 1) {
      history = history.slice(0, historyIndex + 1);
    }
    history.push(JSON.stringify(tasks));
    if (history.length > MAX_HISTORY) {
      history.shift();
    }
    historyIndex = history.length - 1;
  }

  function undo() {
    if (historyIndex > 0) {
      historyIndex--;
      tasks = JSON.parse(history[historyIndex]);
      saveTasks();
      loadTasks();
      showInPageNotification('↩️ Annuler', 'Action annulée');
    }
  }

  function redo() {
    if (historyIndex < history.length - 1) {
      historyIndex++;
      tasks = JSON.parse(history[historyIndex]);
      saveTasks();
      loadTasks();
      showInPageNotification('↪️ Rétablir', 'Action rétablie');
    }
  }

  // Ajouter une catégorie à une tâche
  function addCategoryToTask(index, category) {
    if (!category || category.trim() === '') return;
    if (!tasks[index].categories) tasks[index].categories = [];
    const cat = category.trim().charAt(0).toUpperCase() + category.trim().slice(1).toLowerCase();
    
    if (!tasks[index].categories.includes(cat)) {
      tasks[index].categories.push(cat);
      tasks[index].category = cat; // Catégorie principale
      
      // Ajouter à la liste globale des catégories
      if (!categories.includes(cat)) {
        categories.push(cat);
      }
      saveTasks();
      loadTasks();
    }
  }

  // Supprimer une catégorie d'une tâche
  function removeCategoryFromTask(index, category) {
    if (!tasks[index].categories) return;
    tasks[index].categories = tasks[index].categories.filter(c => c !== category);
    if (tasks[index].category === category) {
      tasks[index].category = tasks[index].categories.length > 0 ? tasks[index].categories[0] : '';
    }
    saveTasks();
    loadTasks();
    showInPageNotification('🏷️ Catégorie supprimée', `"${category}" retirée de la tâche`);
  }

  // Filtrer par catégorie
  function setCategoryFilter(category) {
    currentCategory = category;
    document.querySelectorAll('.category-filter button').forEach(btn => btn.classList.remove('active-cat'));
    
    const btns = document.querySelectorAll('.category-filter button');
    btns.forEach(btn => {
      if (btn.textContent === category || (category === 'all' && btn.textContent === '🏷️ Toutes')) {
        btn.classList.add('active-cat');
      }
    });

  }

  // Nettoyer les catégories inutilisées
  function cleanCategories() {
    const usedCategories = new Set();
    tasks.forEach(task => {
      if (task.categories) {
        task.categories.forEach(c => usedCategories.add(c));

      if (task.category) usedCategories.add(task.category);

    categories = categories.filter(c => usedCategories.has(c));

    const taskList = document.getElementById("taskList");

    const search = document.getElementById("searchInput").value.toLowerCase();

    // Filtrer et trier
    let filteredTasks = tasks
        .map((task, index) => ({ task, index }))
        .filter(({ task }) => matchesFilter(task) && matchesCategory(task) && matchesSearch(task) && shouldDisplayTask(task));

    // Trier : épinglées en premier
    filteredTasks.sort((a, b) => {
        if (a.task.pinned && !b.task.pinned) return -1;
        if (!a.task.pinned && b.task.pinned) return 1;
        return 0;
    });

    if (filteredTasks.length === 0) {
        taskList.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Aucune tâche trouvée</div>';
    }

    filteredTasks.forEach(({ task, index }) => {
        const taskDiv = document.createElement("div");
        taskDiv.className = "task";
        if (task.completed) taskDiv.classList.add("completed");
        if (task.pinned) taskDiv.classList.add("pinned");

        if (task.repeat === "daily") taskDiv.classList.add("priority-daily");
        if (task.repeat === "monthly") taskDiv.classList.add("priority-monthly");
        if (task.repeat === "yearly") taskDiv.classList.add("priority-yearly");

        const categoryBadges = getCategoryBadges(task);
        const pinIcon = task.pinned ? '📌 ' : '';

  function playNotificationSound() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Premier bip
        const oscillator1 = audioContext.createOscillator();
        const gainNode1 = audioContext.createGain();
        oscillator1.connect(gainNode1);
        gainNode1.connect(audioContext.destination);
        oscillator1.frequency.value = 880;
        oscillator1.type = 'sine';
        gainNode1.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        oscillator1.start(audioContext.currentTime);
        oscillator1.stop(audioContext.currentTime + 0.3);
        
        // Deuxième bip (plus aigu)
        setTimeout(() => {
            const oscillator2 = audioContext.createOscillator();
            const gainNode2 = audioContext.createGain();
            oscillator2.connect(gainNode2);
            gainNode2.connect(audioContext.destination);
            oscillator2.frequency.value = 1100;
            oscillator2.type = 'sine';
            gainNode2.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            oscillator2.start(audioContext.currentTime);
            oscillator2.stop(audioContext.currentTime + 0.2);
        }, 200);
        
        // Troisième bip (grave)
        setTimeout(() => {
            const oscillator3 = audioContext.createOscillator();
            const gainNode3 = audioContext.createGain();
            oscillator3.connect(gainNode3);
            gainNode3.connect(audioContext.destination);
            oscillator3.frequency.value = 660;

let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();

// Afficher le calendrier
function showCalendar() {
    // Supprimer l'ancien calendrier s'il existe
    const oldCalendar = document.querySelector('.calendar-container');
    if (oldCalendar) oldCalendar.remove();
    
    renderCalendar();
}

// Rendre le calendrier
function renderCalendar() {
    const now = new Date();
    const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
    const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const monthName = new Date(calendarYear, calendarMonth).toLocaleString('fr-FR', { month: 'long' });
    
    let html = `
        <div class="calendar-container">
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">◀</button>
                <h5 style="margin:0;text-transform:capitalize;">${monthName} ${calendarYear}</h5>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-bottom:10px;">
    `;
    
    const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    days.forEach(d => html += `<div style="font-weight:bold;font-size:12px;">${d}</div>`);
    
    html += `</div><div class="calendar-grid">`;
    
    // Ajuster pour commencer par Lundi
    const startOffset = firstDay === 0 ? 6 : firstDay - 1;
    
    // Espaces vides
    for (let i = 0; i < startOffset; i++) {
        html += `<div class="calendar-day" style="opacity:0.3;">${i - startOffset + 1}</div>`;
    }
    
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const tasksToday = tasks.filter(t => t.dueDate === dateStr && !t.completed);
        const hasTasks = tasksToday.length > 0;
        const isToday = day === now.getDate() && 
                       calendarMonth === now.getMonth() && 
                       calendarYear === now.getFullYear();
        
        let classes = 'calendar-day';
        if (isToday) classes += ' today';
        if (hasTasks) classes += ' has-tasks';
        
        html += `
            <div class="${classes}" 
                 onclick="showTasksForDate('${dateStr}')"
                 title="${hasTasks ? tasksToday.map(t => t.text).join('\n') : 'Aucune tâche'}">
                ${day}
                ${hasTasks ? `<div style="font-size:8px;color:${isToday ? 'white' : '#ff9800'};">●</div>` : ''}
            </div>
        `;
    }
    
    html += `
            </div>
            <div style="margin-top:15px;display:flex;gap:5px;">
                <button onclick="document.querySelector('.calendar-container').remove()" 
                        style="flex:1;background:#6c757d;color:white;border:none;padding:8px;border-radius:8px;">Fermer</button>
                <button onclick="showTodayTasks()" 
                        style="flex:1;background:#007bff;color:white;border:none;padding:8px;border-radius:8px;">📅 Aujourd'hui</button>
            </div>
        </div>
    `;
    
    const container = document.createElement('div');
    container.innerHTML = html;
    document.body.appendChild(container.firstElementChild);
}

// Changer de mois
function changeMonth(delta) {
    calendarMonth += delta;
    if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
    } else if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
    }
    renderCalendar();
}

// Afficher les tâches d'une date
function showTasksForDate(dateStr) {
    const tasksToday = tasks.filter(t => t.dueDate === dateStr && !t.completed);
    const completedToday = tasks.filter(t => t.dueDate === dateStr && t.completed);
    
    if (tasksToday.length === 0 && completedToday.length === 0) {
        showInPageNotification('📅 ' + formatDate(dateStr), 'Aucune tâche pour cette date');
        return;
    }
    
    let message = '';
    if (tasksToday.length > 0) {
        message += '⏳ En attente:\n' + tasksToday.map((t, i) => `${i+1}. ${t.text}`).join('\n');
    }
    if (completedToday.length > 0) {
        if (message) message += '\n\n';
        message += '✅ Accomplies:\n' + completedToday.map((t, i) => `${i+1}. ${t.text}`).join('\n');
    }
    
    showInPageNotification(`📅 ${formatDate(dateStr)} (${tasksToday.length + completedToday.length} tâches)`, message);
}

// Afficher les tâches d'aujourd'hui
function showTodayTasks() {
    const today = new Date().toISOString().split('T')[0];
    showTasksForDate(today);
    // Fermer le calendrier
    const calendar = document.querySelector('.calendar-container');
    if (calendar) calendar.remove();
}

// Aller à aujourd'hui dans le calendrier
function goToToday() {
    const now = new Date();
    calendarMonth = now.getMonth();
    calendarYear = now.getFullYear();
    renderCalendar();
}

let pendingSync = false;
let syncInterval = null;

// Initialiser la gestion de la connexion
function initConnectionManager() {
    updateConnectionStatus();
    
    // Écouter les événements de connexion
    window.addEventListener('online', function() {
        isOnline = true;
        updateConnectionStatus();
        showInPageNotification('📶 Connecté', 'Vous êtes de nouveau en ligne');
        
        // Synchroniser automatiquement
        if (pendingSync) {
            syncTasks();
        }
    });
    
    window.addEventListener('offline', function() {
        isOnline = false;
        updateConnectionStatus();
        showOfflineBanner();
        showInPageNotification('📶 Hors ligne', 'Mode hors ligne activé - les modifications seront synchronisées plus tard');
    });
    
    // Vérifier périodiquement la connexion
    setInterval(checkConnection, 30000);
}

// Vérifier la connexion
function checkConnection() {
    const wasOnline = isOnline;
    isOnline = navigator.onLine;
    
    if (wasOnline !== isOnline) {
        updateConnectionStatus();
        if (isOnline) {
            showInPageNotification('📶 Connecté', 'Connexion rétablie');
            if (pendingSync) {
                syncTasks();
            }
            hideOfflineBanner();
        } else {
            showOfflineBanner();
        }
    }
}

// Mettre à jour le statut de connexion
function updateConnectionStatus() {
    const statusEl = document.getElementById('connectionStatus');
    if (!statusEl) return;
    
    if (isOnline) {
        statusEl.textContent = '📶 Connecté';
        statusEl.className = 'online';
    } else {
        statusEl.textContent = '📶 Hors ligne';
        statusEl.className = 'offline';
    }
}

// Afficher la bannière hors ligne
function showOfflineBanner() {
    const existing = document.querySelector('.offline-banner');
    if (existing) return;
    
    const banner = document.createElement('div');
    banner.className = 'offline-banner';
    banner.id = 'offlineBanner';
    banner.innerHTML = `
        📶 Mode hors ligne - Les modifications seront synchronisées automatiquement
        <button class="retry-btn" onclick="syncTasks()">🔄 Réessayer</button>
    `;
    document.body.prepend(banner);
}

// Cacher la bannière hors ligne
function hideOfflineBanner() {
    const banner = document.querySelector('.offline-banner');
    if (banner) banner.remove();
}

// Synchroniser les tâches
function syncTasks() {
    if (!isOnline) {
        pendingSync = true;
        showInPageNotification('📶 Hors ligne', 'Impossible de synchroniser - pas de connexion');
        return;
    }
    
    pendingSync = false;
    
    // Sauvegarder vers Google Drive
    saveToGoogleDrive();
    
    // Synchroniser avec le serveur
    fetch(APPS_SCRIPT_URL + '?action=sync', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        if (data && data.tasks) {
            // Fusionner les tâches
            const merged = mergeTasks(tasks, data.tasks);
            tasks = merged;
            saveTasks();
            loadTasks();
            showInPageNotification('🔄 Synchronisé', 'Tâches synchronisées avec le serveur');
        } else {
            showInPageNotification('🔄 Synchronisé', 'Sauvegarde effectuée');
        }
    })
    .catch(error => {
        console.error('Erreur synchronisation:', error);
        pendingSync = true;
    });
    
    // Mettre à jour le statut
    updateConnectionStatus();
    hideOfflineBanner();
}

// Fusionner les tâches locales et distantes
function mergeTasks(localTasks, remoteTasks) {
    const merged = [...localTasks];
    const localKeys = new Set(localTasks.map(t => t.text + t.dueDate));
    
    remoteTasks.forEach(remoteTask => {
        const key = remoteTask.text + remoteTask.dueDate;
        if (!localKeys.has(key)) {
            merged.push(remoteTask);
        } else {
            // Mettre à jour la tâche existante si elle est plus récente
            const localIndex = localTasks.findIndex(t => t.text + t.dueDate === key);
            if (localIndex !== -1) {
                const localTask = localTasks[localIndex];
                // Comparer les dates de modification
                if (remoteTask.lastModified && (!localTask.lastModified || 
                    new Date(remoteTask.lastModified) > new Date(localTask.lastModified))) {
                    merged[localIndex] = remoteTask;
                }
            }
        }
    });
    
    return merged;
}

// Modifier saveTasks pour marquer le dernier changement
function saveTasksWithSync() {
    tasks.forEach(task => {
        task.lastModified = new Date().toISOString();
    });
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("categories", JSON.stringify(categories));
    
    // Si en ligne, synchroniser automatiquement
    if (isOnline) {
        // Débounce pour éviter trop de requêtes
        clearTimeout(window.syncTimeout);
        window.syncTimeout = setTimeout(() => {
            syncTasks();
        }, 5000);
    } else {
        pendingSync = true;
    }
}

// Sauvegarde manuelle
function manualSync() {
    syncTasks();
    showInPageNotification('🔄 Sync', 'Synchronisation manuelle demandée');
}

// Sauvegarde programmée toutes les heures
setInterval(() => {
    if (isOnline) {
        syncTasks();
    }
}, 3600000);

// === FONCTIONS POUR LES NOTES ===

// Ajouter ou modifier une note
function addNoteToTask(index) {
  const task = tasks[index];
  if (!task) return;
  
  const currentNote = task.note || '';
  const note = prompt('✏️ Ajouter/modifier une note pour cette tâche :\n\n(Laisser vide pour supprimer)', currentNote);
  
  if (note === null) return; // Annulé
  
  if (note.trim() === '') {
    // Supprimer la note
    if (task.note) {
      if (confirm('Supprimer la note de cette tâche ?')) {
        delete task.note;
        saveTasks();
        loadTasks();
      }
    }
    return;
  }
  
  // Sauvegarder la note
  task.note = note.trim();
  task.updatedAt = new Date().toISOString();
  saveTasks();
  loadTasks();
  saveToGoogleDrive();
}

// Ajouter un commentaire rapide (sans popup)
function addQuickNote(index) {
  const task = tasks[index];
  if (!task) return;
  
  // Créer une interface de saisie rapide
  const noteInput = document.createElement('div');
  noteInput.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 90%;
  `;
  noteInput.innerHTML = `
    <h4 style="margin-top:0;">📝 Note pour "${task.text}"</h4>
    <textarea id="quickNoteText" style="width:100%;min-height:100px;padding:10px;border-radius:5px;border:1px solid #ccc;font-size:14px;" placeholder="Écrivez votre note ici...">${task.note || ''}</textarea>
    <div style="margin-top:10px;display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="this.closest('div[style]').remove()" style="background:#6c757d;">Annuler</button>
      <button onclick="saveQuickNote(${index})" style="background:#007bff;">💾 Sauvegarder</button>
    </div>
  `;
  document.body.appendChild(noteInput);
  
  // Focus sur le textarea
  setTimeout(() => document.getElementById('quickNoteText').focus(), 100);
}

// Sauvegarder la note rapide
function saveQuickNote(index) {
  const textarea = document.getElementById('quickNoteText');
  if (!textarea) return;
  
  const note = textarea.value.trim();
  const task = tasks[index];
  
  if (note === '') {
    delete task.note;
  } else {
    task.note = note;
  }
  
  task.updatedAt = new Date().toISOString();
  saveTasks();
  loadTasks();
  saveToGoogleDrive();
  showInPageNotification('📝 Note sauvegardée', `Note mise à jour pour "${task.text}"`);
  
  // Fermer la popup
  const popup = textarea.closest('div[style]');
  if (popup) popup.remove();
}

// Voir toutes les notes (vue d'ensemble)
function viewAllNotes() {
  const tasksWithNotes = tasks.filter(t => t.note && t.note.trim() !== '');
  
  if (tasksWithNotes.length === 0) {
    showInPageNotification('📝 Aucune note', 'Aucune tâche ne contient de note');
    return;
  }
  
  const notesContainer = document.createElement('div');
  notesContainer.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  `;
  
  let html = `
    <h4 style="margin-top:0;">📝 Toutes les notes (${tasksWithNotes.length})</h4>
    <button onclick="this.closest('div[style]').remove()" style="position:absolute;top:10px;right:10px;background:#dc3545;color:white;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;">✕</button>
    <hr>
  `;
  
  tasksWithNotes.forEach(task => {
    const taskIndex = tasks.indexOf(task);
    html += `
      <div style="margin-bottom:15px;padding:10px;background:#f8f9fa;border-radius:8px;border-left:3px solid #ffc107;">
        <div style="font-weight:bold;display:flex;justify-content:space-between;">
          <span>${task.text}</span>
          <span style="font-size:12px;color:#666;">
            ${task.dueDate ? `📅 ${formatDate(task.dueDate)}` : ''}
          </span>
        </div>
        <div style="margin-top:5px;font-size:14px;color:#333;padding:5px;background:white;border-radius:5px;">
          ${task.note}
        </div>
        <div style="margin-top:5px;display:flex;gap:5px;">
          <button onclick="editNoteFromView(${taskIndex})" style="font-size:11px;padding:2px 8px;">✏️ Modifier</button>
          <button onclick="deleteNoteFromView(${taskIndex})" style="font-size:11px;padding:2px 8px;background:#dc3545;">🗑️ Supprimer</button>
        </div>
      </div>
    `;
  });
  
  notesContainer.innerHTML = html;
  document.body.appendChild(notesContainer);
}

// Éditer une note depuis la vue d'ensemble
function editNoteFromView(index) {
  const task = tasks[index];
  if (!task) return;
  
  const newNote = prompt('Modifier la note :', task.note || '');
  if (newNote === null) return;
  
  if (newNote.trim() === '') {
    delete task.note;
  } else {
    task.note = newNote.trim();
  }
  
  task.updatedAt = new Date().toISOString();
  saveTasks();
  loadTasks();
  saveToGoogleDrive();
  
  // Rafraîchir la vue
  const container = document.querySelector('[style*="position:fixed"][style*="z-index:10000"]');
  if (container) {
    viewAllNotes();
  }
  
}

// Supprimer une note depuis la vue d'ensemble
function deleteNoteFromView(index) {
  const task = tasks[index];
  if (!task) return;
  
  if (confirm(`Supprimer la note de "${task.text}" ?`)) {
    delete task.note;
    saveTasks();
    loadTasks();
    saveToGoogleDrive();
    
    // Rafraîchir la vue
    const container = document.querySelector('[style*="position:fixed"][style*="z-index:10000"]');
    if (container) {
      viewAllNotes();
    }
    showInPageNotification('📝 Note supprimée', `Note supprimée de "${task.text}"`);
  }
}

// Exporter les notes (pour sauvegarde)
function exportNotes() {
  const tasksWithNotes = tasks.filter(t => t.note && t.note.trim() !== '');
  
  if (tasksWithNotes.length === 0) {
    showInPageNotification('📝 Aucune note', 'Aucune note à exporter');
    return;
  }
  
  let text = '=== NOTES DES TÂCHES ===\n\n';
  text += `Exporté le: ${new Date().toLocaleString()}\n`;
  text += `Total: ${tasksWithNotes.length} notes\n\n`;
  text += '='.repeat(50) + '\n\n';
  
  tasksWithNotes.forEach((task, i) => {
    text += `📌 TÂCHE ${i+1}: ${task.text}\n`;
    text += `📅 Date: ${task.dueDate || 'Non définie'}\n`;
    text += `📝 Note: ${task.note}\n`;
    text += `✅ Statut: ${task.completed ? 'Accomplie' : 'En attente'}\n`;
    text += '-'.repeat(30) + '\n\n';
  });
  
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `notes_export_${new Date().toISOString().split('T')[0]}.txt`;
  a.click();
  
  showInPageNotification('📤 Export réussi', `${tasksWithNotes.length} notes exportées`);
}

// Rechercher dans les notes
function searchNotes() {
  const search = prompt('🔍 Rechercher dans les notes :');
  if (!search || search.trim() === '') return;
  
  const searchTerm = search.trim().toLowerCase();
  const results = tasks.filter(t => 
    t.note && t.note.toLowerCase().includes(searchTerm)
  );
  
  if (results.length === 0) {
    showInPageNotification('🔍 Aucun résultat', `Aucune note ne contient "${searchTerm}"`);
    return;
  }
  
  const container = document.createElement('div');
  container.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  `;
  
  let html = `
    <h4>🔍 Résultats pour "${searchTerm}" (${results.length})</h4>
    <button onclick="this.closest('div[style]').remove()" style="position:absolute;top:10px;right:10px;background:#dc3545;color:white;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;">✕</button>
    <hr>
  `;
  
  results.forEach(task => {
    const highlightedNote = task.note.replace(
      new RegExp(searchTerm, 'gi'),
      match => `<span style="background:yellow;font-weight:bold;">${match}</span>`
    );
    
    html += `
      <div style="margin-bottom:10px;padding:10px;background:#f8f9fa;border-radius:5px;">
        <div style="font-weight:bold;">${task.text}</div>
        <div style="font-size:14px;margin-top:5px;">${highlightedNote}</div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  document.body.appendChild(container);
}

// Ajouter des commentaires chronologiques
function addCommentToTask(index) {
  const task = tasks[index];
  if (!task) return;
  
  const comment = prompt('💬 Ajouter un commentaire :');
  if (!comment || comment.trim() === '') return;
  
  if (!task.comments) task.comments = [];
  task.comments.push({
    text: comment.trim(),
    date: new Date().toISOString()
  });
  
  task.updatedAt = new Date().toISOString();
  saveTasks();
  loadTasks();
  saveToGoogleDrive();
  showInPageNotification('💬 Commentaire ajouté', `Commentaire ajouté à "${task.text}"`);
}

// Afficher les commentaires dans la tâche
function getCommentsHtml(task) {
  if (!task.comments || task.comments.length === 0) return '';
  
  return `
    <div style="margin-top:5px;padding:5px;background:rgba(255,255,255,0.3);border-radius:5px;font-size:11px;">
      <div style="font-weight:bold;color:#666;">💬 Commentaires (${task.comments.length})</div>
      ${task.comments.slice(-3).reverse().map(c => `
        <div style="padding:2px 0;border-bottom:1px solid rgba(0,0,0,0.05);">
          <span>${c.text}</span>
          <span style="color:#999;font-size:9px;">${new Date(c.date).toLocaleDateString('fr-FR')}</span>
        </div>
      `).join('')}
      ${task.comments.length > 3 ? `<div style="color:#666;font-size:9px;">... ${task.comments.length - 3} commentaires supplémentaires</div>` : ''}
    </div>
  `;
}
